<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' bsfile: data: https://shared.cloudflare.steamstatic.com https://cdn.cloudflare.steamstatic.com">
<title>Boxshelf Home</title>
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="home.css">
</head>
<body class="layout-side">
  <!-- The in-game Home menu. A transparent, non-focusable window over the running emulator: the game keeps focus
       (so it stays fullscreen and gets the hotkeys Boxshelf sends), and the controller arrives from the main
       process. -->
  <div class="dim" id="dim"></div>
  <aside class="panel" id="panel" aria-label="Home menu">
    <div class="top"><span class="brand">Boxshelf</span><span class="clock" id="clock"></span></div>
    <div class="now">
      <div class="cover"><img id="cover" alt=""></div>
      <div class="meta">
        <div class="sys" id="sys"></div>
        <div class="title" id="title"></div>
        <div class="time" id="time"></div>
      </div>
    </div>
    <div class="paused" id="paused"><i></i>Game paused</div>
    <nav class="items" id="items" role="menu"></nav>
    <div class="foot" id="foot"></div>
  </aside>
  <div class="toast" id="toast"></div>
  <script src="songs.js"></script>
  <script src="sound.js"></script>
  <script src="home.js"></script>
</body>
</html>
