name: Build Pulse AI
on:
  push:
    paths: ["localai/**", "aistt/**", ".github/workflows/ai.yml"]
  workflow_dispatch:
    inputs:
      release:
        description: "Publish as a GitHub release (tag ai-v<versionName>)"
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PULSE_STORE_PASSWORD: ${{ secrets.PULSE_STORE_PASSWORD }}
      PULSE_KEY_PASSWORD: ${{ secrets.PULSE_KEY_PASSWORD }}
      # pinned sources (the commits the JNI in localai and aistt was written against)
      LLAMA_COMMIT: a691b2345844ce1b430201fc5fd404ce062e05f2
      WHISPER_COMMIT: f92e1e4d1056700c39d4e86c1140f0a088fe1ab6
    steps:
      - uses: actions/checkout@v5
      - name: Release key from the secrets
        shell: bash
        env:
          PULSE_KEYSTORE_B64: ${{ secrets.PULSE_KEYSTORE_B64 }}
        run: |
          echo "$PULSE_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/pulse.keystore"
          echo "PULSE_KEYSTORE=$RUNNER_TEMP/pulse.keystore" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: SDK, NDK and CMake
        run: |
          SDKMANAGER=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin | tail -1)/sdkmanager
          yes | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" "platforms;android-36" "build-tools;34.0.0" "ndk;29.0.13113456" "cmake;3.31.6" > /dev/null
      - name: llama.cpp and whisper.cpp sources
        run: |
          mkdir -p localai/vendor && cd localai/vendor
          for r in "llama.cpp $LLAMA_COMMIT" "whisper.cpp $WHISPER_COMMIT"; do
            set -- $r
            git init -q "$1" && git -C "$1" remote add origin "https://github.com/ggml-org/$1.git"
            git -C "$1" fetch -q --depth 1 origin "$2" && git -C "$1" checkout -q FETCH_HEAD
          done
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: 8.9
      - name: Build
        shell: bash
        run: set -o pipefail; gradle :localai:assembleRelease -PwithAi -Dorg.gradle.jvmargs='-Xmx6g -Dfile.encoding=UTF-8' --no-daemon 2>&1 | tee build.log
      - name: Errors
        if: failure()
        run: |
          grep -n -E "error:|e: |FAILED|CMake Error" build.log | head -80 || true
      - uses: actions/upload-artifact@v5
        with:
          name: pulse-ai-apk
          path: localai/build/outputs/apk/release/localai-release.apk
      - name: Facts for the extras manifest (size, sha256, signing certificate)
        run: |
          APK=localai/build/outputs/apk/release/localai-release.apk
          echo "size: $(stat -c %s $APK)"; echo "sha256: $(sha256sum $APK | cut -d' ' -f1)"
          "$ANDROID_HOME"/build-tools/34.0.0/apksigner verify --print-certs $APK | grep -i "SHA-256" || true
      - name: Publish
        if: github.event_name == 'workflow_dispatch' && inputs.release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(grep -oP 'versionName = "\K[^"]+' localai/build.gradle.kts)
          cp localai/build/outputs/apk/release/localai-release.apk "PulseAI-$VER.apk"
          gh release create "ai-v$VER" "PulseAI-$VER.apk" --target "$GITHUB_SHA" --title "Pulse AI $VER" --notes "Pulse AI: local chat (llama.cpp) and timed lyrics (whisper.cpp). Models download into Download/PulseAI from inside the app."
