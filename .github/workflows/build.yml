name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release:
        description: "Publish this build as a GitHub release (tag v<versionName>)"
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Install SDK packages
        run: |
          SDKMANAGER=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin | tail -1)/sdkmanager
          yes | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: 8.9
      - name: Build release APK
        shell: bash
        run: set -o pipefail; gradle assembleRelease -Dorg.gradle.jvmargs='-Xmx6g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8' -Pkotlin.daemon.jvmargs=-Xmx6g -Porg.gradle.workers.max=4 -x lintVitalAnalyzeRelease -x lintVitalReportRelease -x lintVitalRelease --no-daemon 2>&1 | tee build.log
      - name: Compile errors as annotations
        if: failure()
        run: |
          grep -E '^e: |What went wrong|error:|AAPT|FAILED|Execution failed|Manifest merger' -A3 build.log | grep -v '^--$' | head -45 | while IFS= read -r line; do echo "::error::${line}"; done
      - uses: actions/upload-artifact@v5
        with:
          name: pulse-release-apk
          path: app/build/outputs/apk/release/app-release.apk
      - name: Publish the release
        if: github.event_name == 'workflow_dispatch' && inputs.release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          # the build above is the Android 5 and up one; the normal one (Android 12 and up, the same code) is built now
          cp app/build/outputs/apk/release/app-release.apk "Pulse-$VER-android5.apk"
          gradle assembleRelease -PpulseMinSdk=31 -Dorg.gradle.jvmargs='-Xmx6g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8' -Pkotlin.daemon.jvmargs=-Xmx6g -Porg.gradle.workers.max=4 -x lintVitalAnalyzeRelease -x lintVitalReportRelease -x lintVitalRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "Pulse-$VER.apk"
          # the notes: every YAPILACAKLAR.md entry from the version after the last release up to this one
          PREV=$(gh release list --limit 1 --exclude-drafts --json tagName -q '.[0].tagName' 2>/dev/null | sed 's/^v//')
          python3 -I .github/release_notes.py "$VER" "$PREV" > RELEASE_NOTES.md
          gh release create "v$VER" "Pulse-$VER.apk" "Pulse-$VER-android5.apk" --target "$GITHUB_SHA" --title "Pulse $VER" --notes-file RELEASE_NOTES.md
