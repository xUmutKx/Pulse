name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install SDK packages
        run: |
          SDKMANAGER=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin | tail -1)/sdkmanager
          yes | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build release APK
        shell: bash
        run: set -o pipefail; gradle assembleRelease -x lintVitalAnalyzeRelease -x lintVitalReportRelease -x lintVitalRelease --no-daemon 2>&1 | tee build.log
      - name: Compile errors as annotations
        if: failure()
        run: grep -E '^e: |What went wrong' -A1 build.log | grep -v '^--$' | head -30 | while IFS= read -r line; do echo "::error::${line}"; done
      - uses: actions/upload-artifact@v4
        with:
          name: pulse-release-apk
          path: app/build/outputs/apk/release/app-release.apk
