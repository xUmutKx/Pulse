name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release:
        description: "Publish this build as a GitHub release (tag v<versionName>)"
        type: boolean
        default: false
      play:
        description: "Also build the Google Play files (play APK and AAB) and attach them to the release"
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PULSE_STORE_PASSWORD: ${{ secrets.PULSE_STORE_PASSWORD }}
      PULSE_KEY_PASSWORD: ${{ secrets.PULSE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - name: Release key from the secrets (written to a temporary file, never in the repo)
        shell: bash
        env:
          PULSE_KEYSTORE_B64: ${{ secrets.PULSE_KEYSTORE_B64 }}
        run: |
          if [ -z "$PULSE_KEYSTORE_B64" ]; then echo "::error::PULSE_KEYSTORE_B64 secret is missing"; exit 1; fi
          echo "$PULSE_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/pulse.keystore"
          echo "PULSE_KEYSTORE=$RUNNER_TEMP/pulse.keystore" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Install SDK packages
        run: |
          SDKMANAGER=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin | tail -1)/sdkmanager
          yes | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" "platforms;android-34" "platforms;android-36" "build-tools;34.0.0" "ndk;29.0.13113456" "cmake;3.31.6" > /dev/null
      # Pulse AI's engines: llama.cpp and whisper.cpp at the commits their JNI was written against (built into the app for arm64)
      - name: llama.cpp and whisper.cpp sources
        env:
          LLAMA_COMMIT: a691b2345844ce1b430201fc5fd404ce062e05f2
          WHISPER_COMMIT: f92e1e4d1056700c39d4e86c1140f0a088fe1ab6
        run: |
          mkdir -p localai/vendor && cd localai/vendor
          for r in "llama.cpp $LLAMA_COMMIT" "whisper.cpp $WHISPER_COMMIT"; do
            set -- $r
            git init -q "$1" && git -C "$1" remote add origin "https://github.com/ggml-org/$1.git"
            git -C "$1" fetch -q --depth 1 origin "$2" && git -C "$1" checkout -q FETCH_HEAD
          done
          # Pulse AI: only the Android CPU variants up to armv8.2 are built into the APK (the armv8.6 and armv9 ones are about 6.5 MB of
          # the app). A phone with those features runs the armv8.2 variant, which is the same code without the newest instructions.
          f=llama.cpp/ggml/src/CMakeLists.txt   # (this step is still inside localai/vendor)
          sed -i -E '/ggml_add_cpu_backend_variant\(android_armv(8\.6_1|9\.0_1|9\.2_1|9\.2_2)[ )]/d' "$f"
          test "$(grep -c 'ggml_add_cpu_backend_variant(android_' "$f")" -eq 3
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: 8.9
      - name: Build release APK
        shell: bash
        run: set -o pipefail; gradle assembleFossRelease -Dorg.gradle.jvmargs='-Xmx6g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8' -Pkotlin.daemon.jvmargs=-Xmx6g -Porg.gradle.workers.max=4 -x lintVitalAnalyzeFossRelease -x lintVitalReportFossRelease -x lintVitalFossRelease --no-daemon 2>&1 | tee build.log
      - name: Compile errors as annotations
        if: failure()
        run: |
          grep -E '^e: |What went wrong|error:|AAPT|FAILED|Execution failed|Manifest merger' -A3 build.log | grep -v '^--$' | head -45 | while IFS= read -r line; do echo "::error::${line}"; done
      - uses: actions/upload-artifact@v5
        with:
          name: pulse-release-apk
          path: app/build/outputs/apk/foss/release/app-foss-release.apk
      - name: Publish the release
        if: github.event_name == 'workflow_dispatch' && inputs.release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          # the build above is the Android 5 and up one; the normal one (Android 12 and up, the same code) is built now
          cp app/build/outputs/apk/foss/release/app-foss-release.apk "Pulse-$VER-android5.apk"
          gradle assembleFossRelease -PpulseMinSdk=31 -Dorg.gradle.jvmargs='-Xmx6g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8' -Pkotlin.daemon.jvmargs=-Xmx6g -Porg.gradle.workers.max=4 -x lintVitalAnalyzeFossRelease -x lintVitalReportFossRelease -x lintVitalFossRelease --no-daemon
          cp app/build/outputs/apk/foss/release/app-foss-release.apk "Pulse-$VER.apk"
          # the Google Play files only when asked (input "play"): the open-source releases (GitHub, Obtainium, F-Droid) carry the two foss APKs
          PLAYFILES=""
          if [ "${{ inputs.play }}" = "true" ]; then
            # the play build: the same app with the ads (Google Play store)
            gradle assemblePlayRelease -PpulseMinSdk=24 -Dorg.gradle.jvmargs='-Xmx6g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8' -Pkotlin.daemon.jvmargs=-Xmx6g -Porg.gradle.workers.max=4 -x lintVitalAnalyzePlayRelease -x lintVitalReportPlayRelease -x lintVitalPlayRelease --no-daemon
            cp app/build/outputs/apk/play/release/app-play-release.apk "Pulse-$VER-play.apk"
            # the play bundle (AAB) for the Google Play upload: the same app, Play delivers the split APKs
            gradle bundlePlayRelease -PpulseMinSdk=24 -Dorg.gradle.jvmargs='-Xmx6g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8' -Pkotlin.daemon.jvmargs=-Xmx6g -Porg.gradle.workers.max=4 -x lintVitalAnalyzePlayRelease -x lintVitalReportPlayRelease -x lintVitalPlayRelease --no-daemon
            cp app/build/outputs/bundle/playRelease/app-play-release.aab "Pulse-$VER-play.aab"
            PLAYFILES="Pulse-$VER-play.apk Pulse-$VER-play.aab"
          fi
          # the notes: every YAPILACAKLAR.md entry from the version after the last release up to this one
          PREV=$(gh release list --limit 1 --exclude-drafts --json tagName -q '.[0].tagName' 2>/dev/null | sed 's/^v//')
          python3 -I .github/release_notes.py "$VER" "$PREV" > RELEASE_NOTES.md
          gh release create "v$VER" "Pulse-$VER.apk" "Pulse-$VER-android5.apk" $PLAYFILES --target "$GITHUB_SHA" --title "Pulse $VER" --notes-file RELEASE_NOTES.md
