name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release:
        description: "Publish this build as a GitHub release (tag v<versionName>)"
        type: boolean
        default: false
      lite:
        description: "Also build the lite APK (without Pulse AI), without publishing"
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  # which builds this run needs: a plain run (a push, or a dispatch without "release") makes the full APK only; a release makes both: the full one (Pulse AI inside) and the lite one (without it)
  plan:
    runs-on: ubuntu-latest
    outputs:
      variants: ${{ steps.p.outputs.variants }}
    steps:
      - id: p
        run: |
          V='["full"]'
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && { [ "${{ inputs.release }}" = "true" ] || [ "${{ inputs.lite }}" = "true" ]; }; then V='["full","lite"]'; fi
          echo "variants=$V" >> "$GITHUB_OUTPUT"

  # the builds run side by side on their own machines
  build:
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(needs.plan.outputs.variants) }}
    env:
      PULSE_STORE_PASSWORD: ${{ secrets.PULSE_STORE_PASSWORD }}
      PULSE_KEY_PASSWORD: ${{ secrets.PULSE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - name: Release key from the secrets (written to a temporary file, never in the repo)
        shell: bash
        env:
          PULSE_KEYSTORE_B64: ${{ secrets.PULSE_KEYSTORE_B64 }}
        run: |
          if [ -z "$PULSE_KEYSTORE_B64" ]; then echo "::error::PULSE_KEYSTORE_B64 secret is missing"; exit 1; fi
          echo "$PULSE_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/pulse.keystore"
          echo "PULSE_KEYSTORE=$RUNNER_TEMP/pulse.keystore" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Install SDK packages
        run: |
          SDKMANAGER=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin | tail -1)/sdkmanager
          yes | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" "platforms;android-34" "platforms;android-36" "build-tools;34.0.0" "ndk;29.0.13113456" "cmake;3.31.6" > /dev/null
      # Pulse AI's engines: llama.cpp and whisper.cpp at the commits their JNI was written against (built into the app for arm64)
      - name: llama.cpp and whisper.cpp sources
        env:
          LLAMA_COMMIT: a691b2345844ce1b430201fc5fd404ce062e05f2
          WHISPER_COMMIT: f92e1e4d1056700c39d4e86c1140f0a088fe1ab6
        run: |
          mkdir -p localai/vendor && cd localai/vendor
          for r in "llama.cpp $LLAMA_COMMIT" "whisper.cpp $WHISPER_COMMIT"; do
            set -- $r
            git init -q "$1" && git -C "$1" remote add origin "https://github.com/ggml-org/$1.git"
            git -C "$1" fetch -q --depth 1 origin "$2" && git -C "$1" checkout -q FETCH_HEAD
          done
          # Pulse AI: only the Android CPU variants up to armv8.2 are built into the APK (the armv8.6 and armv9 ones are about 6.5 MB of
          # the app). A phone with those features runs the armv8.2 variant, which is the same code without the newest instructions.
          f=llama.cpp/ggml/src/CMakeLists.txt   # (this step is still inside localai/vendor)
          sed -i -E '/ggml_add_cpu_backend_variant\(android_armv(8\.6_1|9\.0_1|9\.2_1|9\.2_2)[ )]/d' "$f"
          test "$(grep -c 'ggml_add_cpu_backend_variant(android_' "$f")" -eq 3
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: 8.9
          # a branch run also saves the downloaded libraries for the next run (the default is to only read them there)
          cache-read-only: false
      - name: Build
        shell: bash
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          set -o pipefail
          G() { gradle "$@" -Dorg.gradle.jvmargs='-Xmx6g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8' -Pkotlin.daemon.jvmargs=-Xmx6g -Porg.gradle.workers.max=4 --no-daemon 2>&1 | tee -a build.log; }
          VER=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          mkdir -p out
          case "$VARIANT" in
            full)
              # Pulse AI inside (llama.cpp chat and whisper.cpp speech to text, built natively): the longer build
              G assembleFossFullRelease -x lintVitalAnalyzeFossFullRelease -x lintVitalReportFossFullRelease -x lintVitalFossFullRelease
              cp "$(find app/build/outputs/apk -name '*-release.apk' | head -1)" "out/Pulse-$VER.apk" ;;
            lite)
              # the same app without Pulse AI: no native code to build, so it is the quick one
              G assembleFossLiteRelease -x lintVitalAnalyzeFossLiteRelease -x lintVitalReportFossLiteRelease -x lintVitalFossLiteRelease
              cp "$(find app/build/outputs/apk -name '*-release.apk' | head -1)" "out/Pulse-$VER-lite.apk" ;;
          esac
      - name: Compile errors as annotations
        if: failure()
        run: |
          grep -E '^e: |What went wrong|error:|AAPT|FAILED|Execution failed|Manifest merger' -A3 build.log | grep -v '^--$' | head -45 | while IFS= read -r line; do echo "::error::${line}"; done
      - uses: actions/upload-artifact@v5
        with:
          name: pulse-${{ matrix.variant }}
          path: out/*
          if-no-files-found: error

  # the release, once every build is done: the files from the builds above, and the notes of every version since the last release
  publish:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          pattern: pulse-*
          path: files
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          ls -l files
          PREV=$(gh release list --limit 1 --exclude-drafts --json tagName -q '.[0].tagName' 2>/dev/null | sed 's/^v//')
          python3 -I .github/release_notes.py "$VER" "$PREV" > RELEASE_NOTES.md
          # the full APK first (an older app's updater takes the first one it finds), then the lite one
          gh release create "v$VER" "files/Pulse-$VER.apk" "files/Pulse-$VER-lite.apk" --target "$GITHUB_SHA" --title "Pulse $VER" --notes-file RELEASE_NOTES.md
