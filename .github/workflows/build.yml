name: Build APK
on:
  # only when started by hand ("Derle"): a build on every push failed again and again on unfinished work
  workflow_dispatch:
    inputs:
      release:
        description: "Publish this build as a GitHub release (tag v<versionName>)"
        type: boolean
        default: false
      lite:
        description: "Also build the lite APK (without Pulse AI), without publishing"
        type: boolean
        default: false
      watch:
        description: "Build only Pulse Watch (Wear OS); with release it gets a release of its own (tag watch-v...)"
        type: boolean
        default: false
permissions:
  contents: write
env:
  # the Client ID of Pulse's Spotify app (a repository variable, not a secret: a PKCE client id is public)
  SPOTIFY_CLIENT_ID: ${{ vars.SPOTIFY_CLIENT_ID }}
jobs:
  # (the watch APK and the no-SMS APK are not built for now: the lite APK is already the one without Messages) which builds this run needs: a plain run (a push, or a dispatch without "release") makes the full APK only; a release makes the full one (Pulse AI inside), the lite one (without it) and the Google Play bundle
  plan:
    runs-on: ubuntu-latest
    outputs:
      variants: ${{ steps.p.outputs.variants }}
    steps:
      - id: p
        run: |
          V='["full"]'
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && { [ "${{ inputs.release }}" = "true" ] || [ "${{ inputs.lite }}" = "true" ]; }; then V='["full","lite","32bit","play"]'; fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.watch }}" = "true" ]; then V='["watch"]'; fi
          echo "variants=$V" >> "$GITHUB_OUTPUT"

  # the builds run side by side on their own machines
  build:
    needs: plan
    runs-on: ubuntu-latest
    # the Google Play bundle never holds the release back: when it fails the two APKs are still published
    continue-on-error: ${{ matrix.variant == 'play' || matrix.variant == 'watch' }}
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(needs.plan.outputs.variants) }}
    env:
      PULSE_STORE_PASSWORD: ${{ secrets.PULSE_STORE_PASSWORD }}
      PULSE_KEY_PASSWORD: ${{ secrets.PULSE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - name: Release key from the secrets (written to a temporary file, never in the repo)
        shell: bash
        env:
          PULSE_KEYSTORE_B64: ${{ secrets.PULSE_KEYSTORE_B64 }}
        run: |
          if [ -z "$PULSE_KEYSTORE_B64" ]; then echo "::error::PULSE_KEYSTORE_B64 secret is missing"; exit 1; fi
          echo "$PULSE_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/pulse.keystore"
          echo "PULSE_KEYSTORE=$RUNNER_TEMP/pulse.keystore" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          # Pulse Watch is a project of its own on the newer Android Gradle Plugin (9.5)
          java-version: ${{ (matrix.variant == 'watch') && '21' || '17' }}
      - name: Install SDK packages
        if: matrix.variant != 'watch'
        run: |
          SDKMANAGER=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin | tail -1)/sdkmanager
          yes | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" "platforms;android-34" "platforms;android-36" "build-tools;34.0.0" "ndk;29.0.13113456" "cmake;3.31.6" > /dev/null
      # Pulse AI's engines: llama.cpp and whisper.cpp at the commits their JNI was written against (built into the app for arm64)
      - name: llama.cpp and whisper.cpp sources
        if: matrix.variant != 'watch'
        env:
          LLAMA_COMMIT: a691b2345844ce1b430201fc5fd404ce062e05f2
          WHISPER_COMMIT: f92e1e4d1056700c39d4e86c1140f0a088fe1ab6
        run: |
          mkdir -p localai/vendor && cd localai/vendor
          for r in "llama.cpp $LLAMA_COMMIT" "whisper.cpp $WHISPER_COMMIT"; do
            set -- $r
            git init -q "$1" && git -C "$1" remote add origin "https://github.com/ggml-org/$1.git"
            git -C "$1" fetch -q --depth 1 origin "$2" && git -C "$1" checkout -q FETCH_HEAD
          done
          # Pulse AI: only the Android CPU variants up to armv8.2 are built into the APK (the armv8.6 and armv9 ones are about 6.5 MB of
          # the app). A phone with those features runs the armv8.2 variant, which is the same code without the newest instructions.
          f=llama.cpp/ggml/src/CMakeLists.txt   # (this step is still inside localai/vendor)
          sed -i -E '/ggml_add_cpu_backend_variant\(android_armv(8\.6_1|9\.0_1|9\.2_1|9\.2_2)[ )]/d' "$f"
          test "$(grep -c 'ggml_add_cpu_backend_variant(android_' "$f")" -eq 3
      # The keyboard's language model in Rust (native/kbdlm): about four times faster than the Java one. Optional: when this step fails the APK holds no libpulse_lm.so and the keyboard uses its Java code.
      - name: Rust keyboard model
        if: matrix.variant != 'watch'
        continue-on-error: true
        shell: bash
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi
          BIN=$(ls -d "$ANDROID_HOME"/ndk/29.0.13113456)/toolchains/llvm/prebuilt/linux-x86_64/bin
          cd native/kbdlm
          CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$BIN/aarch64-linux-android24-clang" cargo build --release --target aarch64-linux-android
          CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_LINKER="$BIN/armv7a-linux-androideabi24-clang" cargo build --release --target armv7-linux-androideabi
          cd ../shelf3d
          CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$BIN/aarch64-linux-android26-clang" cargo build --release --target aarch64-linux-android
          CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_LINKER="$BIN/armv7a-linux-androideabi26-clang" cargo build --release --target armv7-linux-androideabi
          # the file search of Files (native/filesearch): the folders of the whole phone are walked by several threads (Kotlin falls back to its own walk when the library is missing)
          cd ../filesearch
          CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$BIN/aarch64-linux-android24-clang" cargo build --release --target aarch64-linux-android || true
          CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_LINKER="$BIN/armv7a-linux-androideabi24-clang" cargo build --release --target armv7-linux-androideabi || true
          cd ../kbdlm
          mkdir -p ../../app/src/main/jniLibs/arm64-v8a ../../app/src/main/jniLibs/armeabi-v7a
          cp ../filesearch/target/aarch64-linux-android/release/libpulse_search.so ../../app/src/main/jniLibs/arm64-v8a/ || true
          cp ../filesearch/target/armv7-linux-androideabi/release/libpulse_search.so ../../app/src/main/jniLibs/armeabi-v7a/ || true
          cp ../shelf3d/target/aarch64-linux-android/release/libpulse_shelf.so ../../app/src/main/jniLibs/arm64-v8a/
          cp ../shelf3d/target/armv7-linux-androideabi/release/libpulse_shelf.so ../../app/src/main/jniLibs/armeabi-v7a/
          cp target/aarch64-linux-android/release/libpulse_lm.so ../../app/src/main/jniLibs/arm64-v8a/
          cp target/armv7-linux-androideabi/release/libpulse_lm.so ../../app/src/main/jniLibs/armeabi-v7a/
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: ${{ (matrix.variant == 'watch') && '9.6.0' || '8.9' }}
          # a branch run also saves the downloaded libraries for the next run (the default is to only read them there)
          cache-read-only: false
      - name: Build
        shell: bash
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          set -o pipefail
          G() { gradle "$@" -Dorg.gradle.jvmargs='-Xmx6g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8' -Pkotlin.daemon.jvmargs=-Xmx6g -Porg.gradle.workers.max=4 --no-daemon 2>&1 | tee -a build.log; }
          VER=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          mkdir -p out
          case "$VARIANT" in
            full)
              # Pulse AI inside (llama.cpp chat and whisper.cpp speech to text, built natively): the longer build
              G assembleFossFullRelease -x lintVitalAnalyzeFossFullRelease -x lintVitalReportFossFullRelease -x lintVitalFossFullRelease
              cp "$(find app/build/outputs/apk -name '*-release.apk' | head -1)" "out/Pulse-$VER.apk" ;;
            lite)
              # the same app without Pulse AI: no native code to build, so it is the quick one
              G assembleFossLiteRelease -x lintVitalAnalyzeFossLiteRelease -x lintVitalReportFossLiteRelease -x lintVitalFossLiteRelease
              cp "$(find app/build/outputs/apk -name '*-release.apk' | head -1)" "out/Pulse-$VER-lite.apk" ;;
            nosms)
              # the lite app without any SMS/MMS permission (no Play Protect warning)
              G assembleFossLiteRelease -PnoSms -x lintVitalAnalyzeFossLiteRelease -x lintVitalReportFossLiteRelease -x lintVitalFossLiteRelease
              cp "$(find app/build/outputs/apk -name '*-release.apk' | head -1)" "out/Pulse-$VER-nosms.apk" ;;
            32bit)
              # the APK for the old 32-bit phones (armeabi-v7a): the lite app, since Pulse AI's engines are 64-bit only
              G assembleFossLiteRelease -PpulseAbi=armeabi-v7a -x lintVitalAnalyzeFossLiteRelease -x lintVitalReportFossLiteRelease -x lintVitalFossLiteRelease
              cp "$(find app/build/outputs/apk -name '*-release.apk' | head -1)" "out/Pulse-$VER-32bit.apk" ;;
            watch)
              # Pulse Watch: a project of its own, signed with Pulse's key
              D=wear
              yes | "$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin | tail -1)/sdkmanager" --licenses > /dev/null || true
              printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=pulse\nkeyPassword=%s\n' "$PULSE_KEYSTORE" "$PULSE_STORE_PASSWORD" "$PULSE_KEY_PASSWORD" > "$D/keystore.properties"
              (cd "$D" && G assembleRelease)
              NAME=PulseWatch.apk
              cp "$(find "$D/app/build/outputs/apk" -name '*.apk' | grep -i release | head -1)" "out/$NAME" ;;
            play)
              # the Google Play build (the bundle Play takes: no APK installer permission, the Play flavor): Pulse AI inside like the full one, both processors (Play splits them)
              G bundlePlayFullRelease -PpulseAbi=arm64-v8a,armeabi-v7a -x lintVitalAnalyzePlayFullRelease -x lintVitalReportPlayFullRelease -x lintVitalPlayFullRelease
              cp "$(find app/build/outputs/bundle -name '*.aab' | head -1)" "out/Pulse-$VER-play.aab" ;;
          esac
          # an activity-alias whose activity a flavour removed makes the package uninstallable everywhere ("Can't install" in Play, no message): stop here instead
          M=$(find app/build/intermediates -path '*merged_manifest*' -name AndroidManifest.xml 2>/dev/null)
          if [ -n "$M" ]; then python3 -I scripts/check_manifest.py $M; fi
      - name: Compile errors as annotations
        if: failure()
        run: |
          grep -E '^e: |What went wrong|error:|AAPT|FAILED|Execution failed|Manifest merger' -A3 build.log | grep -v '^--$' | head -45 | while IFS= read -r line; do echo "::error::${line}"; done
      - uses: actions/upload-artifact@v5
        with:
          name: pulse-${{ matrix.variant }}
          path: out/*
          if-no-files-found: error
      # the R8 name map of this build: a crash report of a release shows letters (Q5.dl), this file turns them back into names
      - uses: actions/upload-artifact@v5
        with:
          name: mapping-${{ matrix.variant }}
          path: app/build/outputs/mapping/**/mapping.txt
          if-no-files-found: warn
          retention-days: 90

  # the release, once every build is done: the files from the builds above, and the notes of every version since the last release
  publish:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          pattern: pulse-*
          path: files
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          ls -l files
          # a watch-only run: a release of its own, the phone app's release is left alone
          if [ ! -f "files/Pulse-$VER.apk" ] && [ -f files/PulseWatch.apk ]; then
            WV=$(grep -oP 'versionName = "\K[^"]+' wear/app/build.gradle.kts)
            gh release create "watch-v$WV-$GITHUB_RUN_NUMBER" files/PulseWatch.apk --target "$GITHUB_SHA" --title "Pulse Watch $WV" --notes "Pulse Watch (Wear OS)."
            exit 0
          fi
          PREV=$(gh release list --limit 20 --exclude-drafts --json tagName -q '[.[] | select(.tagName | test("^v[0-9]"))][0].tagName' 2>/dev/null | sed 's/^v//')
          python3 -I .github/release_notes.py "$VER" "$PREV" > RELEASE_NOTES.md
          # the full APK first (an older app's updater takes the first one it finds), then the lite one
          ASSETS=("files/Pulse-$VER.apk" "files/Pulse-$VER-lite.apk")
          # the Google Play bundle when it was built (it is only for the Play Console, not for installing)
          [ -f "files/Pulse-$VER-nosms.apk" ] && ASSETS+=("files/Pulse-$VER-nosms.apk")
          [ -f "files/Pulse-$VER-32bit.apk" ] && ASSETS+=("files/Pulse-$VER-32bit.apk")
          [ -f "files/Pulse-$VER-play.aab" ] && ASSETS+=("files/Pulse-$VER-play.aab")
          [ -f "files/PulseWatch.apk" ] && ASSETS+=("files/PulseWatch.apk")
          gh release create "v$VER" "${ASSETS[@]}" --target "$GITHUB_SHA" --title "Pulse $VER" --notes-file RELEASE_NOTES.md
