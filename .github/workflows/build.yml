name: Build APK
on:
  push:
    branches: [main, size-and-compat]
  workflow_dispatch:
    inputs:
      release:
        description: "Publish this build as a GitHub release (tag v<versionName>)"
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install SDK packages
        run: |
          SDKMANAGER=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin | tail -1)/sdkmanager
          yes | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build release APK
        shell: bash
        run: set -o pipefail; gradle assembleRelease -Dorg.gradle.jvmargs='-Xmx6g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8' -Pkotlin.daemon.jvmargs=-Xmx6g -Porg.gradle.workers.max=4 -x lintVitalAnalyzeRelease -x lintVitalReportRelease -x lintVitalRelease --no-daemon 2>&1 | tee build.log
      - name: NewApi lint (minSdk 21 check)
        if: always()
        continue-on-error: true
        run: |
          gradle :app:lintRelease -Dorg.gradle.jvmargs='-Xmx6g -XX:MaxMetaspaceSize=1g' -Pkotlin.daemon.jvmargs=-Xmx6g --no-daemon > lint.log 2>&1 || true
          grep -E 'Error:|Call requires API|requires API level' app/lint-newapi.txt 2>/dev/null | head -80 | while IFS= read -r l; do echo "::warning::${l}"; done
          grep -c "Call requires" app/lint-newapi.txt || true
          echo "=====LINT-BEGIN====="; grep -E "^/home.*Error" app/lint-newapi.txt | sed "s#/home/runner/work/Pulse/Pulse/app/src/main/java/com/umutk/pulse/##" ; echo "=====LINT-END====="
      - name: Lint chunk 0
        if: always()
        continue-on-error: true
        run: python3 ci/lintchunk.py 0
      - name: Lint chunk 1
        if: always()
        continue-on-error: true
        run: python3 ci/lintchunk.py 1
      - name: Lint chunk 2
        if: always()
        continue-on-error: true
        run: python3 ci/lintchunk.py 2
      - name: Lint chunk 3
        if: always()
        continue-on-error: true
        run: python3 ci/lintchunk.py 3
      - name: Lint chunk 4
        if: always()
        continue-on-error: true
        run: python3 ci/lintchunk.py 4
      - name: Lint chunk 5
        if: always()
        continue-on-error: true
        run: python3 ci/lintchunk.py 5
      - name: Lint chunk 6
        if: always()
        continue-on-error: true
        run: python3 ci/lintchunk.py 6
      - name: Lint chunk 7
        if: always()
        continue-on-error: true
        run: python3 ci/lintchunk.py 7
      - name: Lint chunk 8
        if: always()
        continue-on-error: true
        run: python3 ci/lintchunk.py 8
      - name: Lint chunk 9
        if: always()
        continue-on-error: true
        run: python3 ci/lintchunk.py 9
      - name: Lint chunk 10
        if: always()
        continue-on-error: true
        run: python3 ci/lintchunk.py 10
      - name: Lint chunk 11
        if: always()
        continue-on-error: true
        run: python3 ci/lintchunk.py 11
      - name: Compile errors as annotations
        if: failure()
        run: |
          grep -E '^e: |What went wrong|error:|AAPT|FAILED|Execution failed|Manifest merger' -A3 build.log | grep -v '^--$' | head -45 | while IFS= read -r line; do echo "::error::${line}"; done
      - uses: actions/upload-artifact@v4
        with:
          name: pulse-release-apk
          path: app/build/outputs/apk/release/app-release.apk
      - name: Publish the release
        if: github.event_name == 'workflow_dispatch' && inputs.release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          cp app/build/outputs/apk/release/app-release.apk "Pulse-$VER.apk"
          gh release create "v$VER" "Pulse-$VER.apk" --target "$GITHUB_SHA" --title "Pulse $VER" --notes-file RELEASE_NOTES.md
