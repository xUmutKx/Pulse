[package]
name = "pulse_shelf"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wgpu = { version = "25", default-features = false, features = ["wgsl", "vulkan", "gles"] }
glam = "0.29"
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk = { version = "0.9", features = ["api-level-26"] }
raw-window-handle = "0.6"

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
